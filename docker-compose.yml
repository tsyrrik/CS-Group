services:
  postgres:
    image: postgres:16-alpine
    container_name: file-database-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_scans
      POSTGRES_USER: file_scans
      POSTGRES_PASSWORD: file_scans
    ports:
      - "54325:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  adminer:
    image: adminer:latest
    container_name: file-database-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8085:8080"

volumes:
  postgres-data:

